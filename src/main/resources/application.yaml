spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/investlab}
    username: ${DB_USERNAME:investlab}
    password: ${DB_PASSWORD:investlab}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  auth:
    jwt-secret: ${JWT_SECRET:investlab-local-jwt-secret-key-32bytes}
    access-token-ttl: 30m
    refresh-token-ttl: 7d
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
